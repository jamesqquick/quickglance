<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landing Page Reviewer</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    header p {
      color: #666;
      font-size: 1.1rem;
    }

    /* Form */
    .input-section {
      max-width: 640px;
      margin: 0 auto 2rem;
    }

    .input-section label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.35rem;
      font-size: 0.95rem;
    }

    .input-section input[type="url"],
    .input-section textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      background: #fff;
      transition: border-color 0.15s;
    }

    .input-section input[type="url"]:focus,
    .input-section textarea:focus {
      outline: none;
      border-color: #f6821f;
      box-shadow: 0 0 0 3px rgba(246, 130, 31, 0.15);
    }

    .input-section textarea {
      resize: vertical;
      min-height: 60px;
    }

    .field-group {
      margin-bottom: 1rem;
    }

    .field-hint {
      font-size: 0.8rem;
      color: #888;
      margin-top: 0.25rem;
    }

    .analyze-btn {
      display: block;
      width: 100%;
      padding: 0.85rem;
      background: #f6821f;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .analyze-btn:hover:not(:disabled) {
      background: #e0741a;
    }

    .analyze-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* Error */
    .error-message {
      color: #d32f2f;
      background: #fdecea;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-top: 1rem;
      font-size: 0.95rem;
      display: none;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 3rem 1rem;
      display: none;
    }

    .loading .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #f6821f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading p {
      color: #666;
      font-size: 1rem;
    }

    /* Results */
    .results {
      display: none;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 768px) {
      .results-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Screenshot */
    .screenshot-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .screenshot-card .browser-bar {
      background: #e8e8e8;
      padding: 0.5rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .browser-bar .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
    }

    .screenshot-card img {
      width: 100%;
      display: block;
    }

    /* Report Card */
    .report-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      padding: 1.75rem;
    }

    .grade-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 12px;
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }

    .grade-a {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .grade-b {
      background: #e8f5e9;
      color: #558b2f;
    }
    .grade-c {
      background: #fff8e1;
      color: #f9a825;
    }
    .grade-d {
      background: #fff3e0;
      color: #ef6c00;
    }
    .grade-f {
      background: #fdecea;
      color: #c62828;
    }
    .grade-unknown {
      background: #f5f5f5;
      color: #666;
    }

    .report-card h2 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .main-takeaway {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      line-height: 1.5;
    }

    .alignment-verdict {
      font-size: 0.95rem;
      color: #444;
      margin-bottom: 1.5rem;
      padding: 0.75rem;
      background: #fafafa;
      border-radius: 8px;
      border-left: 3px solid #f6821f;
    }

    .section {
      margin-bottom: 1.25rem;
    }

    .section h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .section ul {
      list-style: none;
      padding: 0;
    }

    .section li {
      padding: 0.35rem 0;
      padding-left: 1.25rem;
      position: relative;
      font-size: 0.95rem;
    }

    .section li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.7rem;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .section-working h3 {
      color: #2e7d32;
    }
    .section-working li::before {
      background: #4caf50;
    }

    .section-confusing h3 {
      color: #f9a825;
    }
    .section-confusing li::before {
      background: #ffc107;
    }

    .section-missing h3 {
      color: #c62828;
    }
    .section-missing li::before {
      background: #e53935;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Landing Page Reviewer</h1>
      <p>See your landing page through a visitor's eyes</p>
    </header>

    <div class="input-section">
      <form id="analyze-form">
        <div class="field-group">
          <label for="url-input">Landing Page URL</label>
          <input
            type="url"
            id="url-input"
            placeholder="https://your-site.com"
            required
          />
        </div>
        <div class="field-group">
          <label for="takeaway-input">What should visitors take away?</label>
          <textarea
            id="takeaway-input"
            placeholder="e.g. We're an AI writing tool that helps marketing teams ship content 10x faster"
            required
          ></textarea>
          <div class="field-hint">
            Describe the #1 thing you want a first-time visitor to understand.
          </div>
        </div>
        <button type="submit" class="analyze-btn" id="analyze-btn">
          Analyze
        </button>
      </form>
      <div class="error-message" id="error-message"></div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Loading your page, taking a screenshot, and running AI analysis&hellip;</p>
    </div>

    <div class="results" id="results">
      <div class="results-grid">
        <div class="screenshot-card">
          <div class="browser-bar">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
          <img id="screenshot-img" src="" alt="Screenshot of the analyzed page" />
        </div>
        <div class="report-card" id="report-card"></div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("analyze-form");
    const urlInput = document.getElementById("url-input");
    const takeawayInput = document.getElementById("takeaway-input");
    const analyzeBtn = document.getElementById("analyze-btn");
    const errorEl = document.getElementById("error-message");
    const loadingEl = document.getElementById("loading");
    const resultsEl = document.getElementById("results");
    const screenshotImg = document.getElementById("screenshot-img");
    const reportCard = document.getElementById("report-card");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();
      const expectedTakeaway = takeawayInput.value.trim();
      if (!url || !expectedTakeaway) return;

      // Reset UI
      errorEl.style.display = "none";
      resultsEl.style.display = "none";
      loadingEl.style.display = "block";
      analyzeBtn.disabled = true;
      analyzeBtn.textContent = "Analyzing\u2026";

      try {
        const res = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, expectedTakeaway }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "Something went wrong");
        }

        // Render results
        screenshotImg.src = data.screenshot;
        reportCard.innerHTML = renderReportCard(data.analysis);
        loadingEl.style.display = "none";
        resultsEl.style.display = "block";
      } catch (err) {
        loadingEl.style.display = "none";
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.textContent = "Analyze";
      }
    });

    function gradeClass(grade) {
      const letter = (grade || "?")[0].toUpperCase();
      if (letter === "A") return "grade-a";
      if (letter === "B") return "grade-b";
      if (letter === "C") return "grade-c";
      if (letter === "D") return "grade-d";
      if (letter === "F") return "grade-f";
      return "grade-unknown";
    }

    function renderList(items) {
      if (!items || items.length === 0)
        return "<p style='color:#999;font-size:0.9rem;'>Nothing to report.</p>";
      return (
        "<ul>" +
        items.map((item) => `<li>${escapeHtml(item)}</li>`).join("") +
        "</ul>"
      );
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function renderReportCard(analysis) {
      return `
        <div class="grade-badge ${gradeClass(analysis.grade)}">${escapeHtml(analysis.grade)}</div>
        <div class="main-takeaway">${escapeHtml(analysis.mainTakeaway)}</div>
        <div class="alignment-verdict">${escapeHtml(analysis.alignmentVerdict)}</div>
        <div class="section section-working">
          <h3>What's Working</h3>
          ${renderList(analysis.whatsWorking)}
        </div>
        <div class="section section-confusing">
          <h3>What's Confusing</h3>
          ${renderList(analysis.whatsConfusing)}
        </div>
        <div class="section section-missing">
          <h3>What's Missing</h3>
          ${renderList(analysis.whatsMissing)}
        </div>
      `;
    }
  </script>
</body>
</html>
